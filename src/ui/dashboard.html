<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BP Cascade RI — CHW worklist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;0,800;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    /* ── Neutrals: warm cream + tan bones ─────────────────────── */
    --bg: #faf6f0;
    --card: #ffffff;
    --card-warm: #fffdf9;
    --border: #ece4d6;
    --border-strong: #ddd2be;
    --tan: #c8a87c;
    --tan-soft: #f4ecdf;
    --text-primary: #231d15;
    --text-secondary: #6d6455;
    --text-muted: #a2977f;
    --radius: 16px;
    --radius-lg: 24px;

    /* ── Vibrant accents (validated: CVD-safe, ≥3:1 on surface) ── */
    --mango: #d2720a;
    --mango-bright: #f2994a;
    --salmon: #e4585f;
    --salmon-bright: #f4867f;
    --aqua: #0fa391;
    --aqua-bright: #2cc9b4;

    /* ── Routing actions (kept variable names) ────────────────── */
    --pharmacist: #0fa391;
    --pharmacist-bg: #e4f6f2;
    --pharmacist-text: #075e52;
    --social: #e4585f;
    --social-bg: #fdecea;
    --social-text: #93242e;
    --chw: #d2720a;
    --chw-bg: #fcefdc;
    --chw-text: #7a4206;
    --sms: #0fa391;
    --sms-bg: #e9f8f4;

    --font-display: "Poppins", "Satoshi", -apple-system, sans-serif;
    --font-ui: "Satoshi", "Poppins", -apple-system, "Segoe UI", sans-serif;

    --shadow-sm: 0 1px 2px rgba(60, 42, 18, 0.06), 0 2px 8px rgba(60, 42, 18, 0.05);
    --shadow-md: 0 2px 6px rgba(60, 42, 18, 0.07), 0 10px 28px rgba(60, 42, 18, 0.08);
    --shadow-lg: 0 4px 12px rgba(60, 42, 18, 0.06), 0 24px 60px rgba(60, 42, 18, 0.10);
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-spring: cubic-bezier(0.34, 1.4, 0.44, 1);
    --ease-glide: cubic-bezier(0.4, 0, 0.2, 1);

    --nav-h: 74px;
    --sp: 0; /* scroll progress 0→1, set from JS */
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--font-ui);
    background: var(--bg);
    color: var(--text-primary);
    padding: 0 0 5rem;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  /* Scroll-reactive ambient gradient — blob anchors drift with --sp */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background:
      radial-gradient(640px 420px at calc(10% + var(--sp) * 22%) calc(-6% + var(--sp) * 34%), rgba(242, 153, 74, 0.17), transparent 62%),
      radial-gradient(720px 480px at calc(92% - var(--sp) * 18%) calc(-4% + var(--sp) * 44%), rgba(44, 201, 180, 0.14), transparent 62%),
      radial-gradient(900px 620px at 50% calc(112% - var(--sp) * 36%), rgba(244, 134, 127, 0.11), transparent 65%),
      radial-gradient(520px 380px at calc(-8% + var(--sp) * 30%) calc(70% - var(--sp) * 20%), rgba(200, 168, 124, 0.10), transparent 60%);
  }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 2rem; }

  :focus-visible {
    outline: 3px solid rgba(242, 153, 74, 0.55);
    outline-offset: 2px;
    border-radius: 6px;
  }

  /* ═══════════════════ NAV / BRANDING ═══════════════════ */
  .topnav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(250, 246, 240, 0.82);
    backdrop-filter: blur(14px) saturate(1.4);
    -webkit-backdrop-filter: blur(14px) saturate(1.4);
    border-bottom: 1px solid rgba(221, 210, 190, 0.55);
  }
  .topnav-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 14px 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .brand { display: flex; align-items: center; gap: 13px; text-decoration: none; user-select: none; }
  .brand-mark {
    width: 44px;
    height: 44px;
    flex: none;
    filter: drop-shadow(0 4px 10px rgba(226, 106, 60, 0.35));
    transform: rotate(-4deg);
    transition: transform 0.45s var(--ease-spring);
  }
  .brand:hover .brand-mark { transform: rotate(4deg) scale(1.08); }
  .brand-text { display: flex; flex-direction: column; line-height: 1.05; }
  .brand-name {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 21px;
    letter-spacing: -0.02em;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand-name .cascade {
    background: linear-gradient(100deg, var(--mango-bright), var(--salmon));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand-name .ri-chip {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    color: #fff;
    background: linear-gradient(135deg, var(--aqua-bright), var(--aqua));
    padding: 3px 8px 2px;
    border-radius: 7px;
    transform: rotate(2deg);
    box-shadow: 0 2px 6px rgba(15, 163, 145, 0.35);
    transition: transform 0.35s var(--ease-spring);
  }
  .brand:hover .ri-chip { transform: rotate(-2deg) scale(1.08); }
  .brand-tag {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.02em;
    margin-top: 2px;
  }
  .brand-tag b { color: var(--tan); font-weight: 700; }

  /* ── EN/ES toggle: a real, physical control ── */
  .lang-toggle {
    display: flex;
    gap: 4px;
    padding: 4px;
    background: var(--tan-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: inset 0 1px 3px rgba(60, 42, 18, 0.08);
  }
  .lang-toggle button {
    border: none;
    background: transparent;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    padding: 7px 16px;
    border-radius: 9px;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all 0.25s var(--ease-spring);
  }
  .lang-toggle button:hover:not(.active) { color: var(--text-primary); background: rgba(255, 255, 255, 0.75); transform: translateY(-1px); }
  .lang-toggle button:active { transform: scale(0.92); }
  .lang-toggle button.active {
    background: var(--text-primary);
    color: #fff;
    box-shadow: 0 2px 5px rgba(35, 29, 21, 0.35), 0 1px 0 rgba(255, 255, 255, 0.15) inset;
  }

  /* ═══════════════════ HERO ═══════════════════ */
  .hero {
    text-align: center;
    padding: 3.8rem 1rem 0.8rem;
  }
  /* Glossy display title: gradient-white fill, crisp dark outline behind the
     fill (paint-order), depth via stacked drop-shadows so the gloss stays
     clean over the transparent fill. */
  .hero-title {
    margin: 0 0 1.1rem;
    display: flex;
    justify-content: center;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 0.34em;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(2.7rem, 6.5vw, 4.6rem);
    letter-spacing: -0.015em;
    line-height: 1.06;
    filter:
      drop-shadow(0 3px 0 rgba(35, 29, 21, 0.82))
      drop-shadow(0 14px 30px rgba(60, 42, 18, 0.22))
      drop-shadow(0 24px 60px rgba(226, 106, 60, 0.20));
  }
  .ht-word {
    background: linear-gradient(180deg, #ffffff 0%, #ffffff 44%, #ffedd8 55%, #fff8f0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    -webkit-text-stroke: 2.2px #241a10;
    paint-order: stroke fill;
  }
  .hero-kicker {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(1.05rem, 1.9vw, 1.35rem);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--mango);
    margin: 0 0 0.6rem;
  }
  .hero .subtitle {
    font-size: clamp(0.98rem, 1.6vw, 1.12rem);
    font-weight: 500;
    color: var(--text-secondary);
    margin: 0 auto;
    max-width: 46em;
    line-height: 1.55;
  }
  .hero-underline {
    width: 84px;
    height: 5px;
    margin: 1.25rem auto 0;
    border-radius: 3px;
    background: linear-gradient(90deg, var(--mango-bright), var(--salmon), var(--aqua-bright));
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(26px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes titleIn {
    from { opacity: 0; transform: translateY(34px) scale(0.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes underlineIn {
    from { opacity: 0; transform: scaleX(0.2); }
    to   { opacity: 1; transform: scaleX(1); }
  }
  .hero-in .ht-word { animation: titleIn 0.8s var(--ease-out) both; }
  .hero-in .ht-word:nth-child(2) { animation-delay: 0.08s; }
  .hero-in .ht-word:nth-child(3) { animation-delay: 0.16s; }
  .hero-in .hero-kicker { animation: rise 0.75s 0.20s var(--ease-out) both; }
  .hero-in .subtitle { animation: rise 0.75s 0.28s var(--ease-out) both; }
  .hero-in .hero-underline { animation: underlineIn 0.7s 0.38s var(--ease-out) both; }

  /* ═══════════════════ META STATS ═══════════════════ */
  .meta-bar {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin: 2.2rem 0 1.8rem;
  }
  .stat-chip {
    display: flex;
    align-items: baseline;
    gap: 10px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 22px;
    box-shadow: var(--shadow-sm);
    transition: transform 0.3s var(--ease-spring), box-shadow 0.3s var(--ease-glide);
  }
  .stat-chip:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .stat-label {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-muted);
  }
  .stat-value {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 22px;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .stat-suffix { font-size: 12.5px; font-weight: 500; color: var(--text-secondary); }

  /* ═══════════════════ TOOLBAR: legend + search + filters ═══════════════════ */
  .toolbar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    padding: 20px 26px 22px;
    margin-bottom: 1.6rem;
    display: flex;
    flex-direction: column;
    gap: 18px;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.6s var(--ease-out), transform 0.6s var(--ease-out);
  }
  .toolbar.ready { opacity: 1; transform: translateY(0); }

  .legend-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    flex-wrap: wrap;
  }
  .legend-head { display: flex; align-items: baseline; gap: 10px; }
  .legend-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.01em;
    color: var(--text-primary);
  }
  .legend-hint { font-size: 11.5px; font-weight: 500; color: var(--text-muted); letter-spacing: 0.02em; }
  .legend { display: flex; gap: 10px; flex-wrap: wrap; }
  .legend-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary);
    background: var(--card-warm);
    border: 1.5px solid var(--border-strong);
    border-radius: 999px;
    padding: 8px 16px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: all 0.28s var(--ease-spring);
  }
  .legend-chip:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .legend-chip:active { transform: scale(0.94); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; transition: transform 0.3s var(--ease-spring); }
  .legend-chip:hover .legend-dot { transform: scale(1.3); }
  .legend-chip .chip-check {
    width: 13px; height: 13px; flex: none;
    color: var(--aqua);
    transform: scale(1);
    transition: transform 0.3s var(--ease-spring), opacity 0.2s ease;
  }
  .legend-chip:not(.active) { background: transparent; border-color: var(--border); box-shadow: none; opacity: 0.5; filter: saturate(0.35); }
  .legend-chip:not(.active) .chip-check { transform: scale(0); opacity: 0; }
  .legend-chip:not(.active):hover { opacity: 0.8; transform: translateY(-1px); }
  .match-count {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    color: var(--pharmacist-text);
    background: var(--sms-bg);
    border: 1px solid rgba(15, 163, 145, 0.3);
    border-radius: 999px;
    padding: 7px 16px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    transition: transform 0.3s var(--ease-spring);
  }
  .match-count.bump { animation: bump 0.4s var(--ease-spring); }
  @keyframes bump { 40% { transform: scale(1.09); } }

  .controls-row {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
    border-top: 1px solid var(--border);
    padding-top: 18px;
  }
  .field-label {
    display: block;
    font-size: 10.5px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--text-muted);
    margin-bottom: 7px;
  }

  .search-box { position: relative; flex: 2 1 240px; min-width: 220px; }
  .search-box .search-icon {
    position: absolute;
    left: 14px;
    bottom: 12px;
    width: 17px; height: 17px;
    color: var(--text-muted);
    pointer-events: none;
    transition: color 0.25s ease, transform 0.3s var(--ease-spring);
  }
  .search-box:focus-within .search-icon { color: var(--mango); transform: scale(1.12); }
  .search-box input {
    width: 100%;
    font-family: var(--font-ui);
    font-size: 14.5px;
    font-weight: 500;
    color: var(--text-primary);
    background: var(--card-warm);
    border: 1.5px solid var(--border-strong);
    border-radius: 12px;
    padding: 11px 14px 11px 40px;
    transition: border-color 0.25s ease, box-shadow 0.25s var(--ease-glide), background 0.25s ease;
  }
  .search-box input::placeholder { color: var(--text-muted); font-weight: 500; }
  .search-box input:hover { border-color: var(--tan); }
  .search-box input:focus {
    outline: none;
    background: var(--card);
    border-color: var(--mango-bright);
    box-shadow: 0 0 0 4px rgba(242, 153, 74, 0.16), var(--shadow-sm);
  }

  .filter-dates { flex: 0 1 auto; }
  .date-pair { display: flex; align-items: center; gap: 8px; }
  .date-pair .date-sep { color: var(--text-muted); font-weight: 700; }
  .date-pair input[type="date"] {
    font-family: var(--font-ui);
    font-size: 13.5px;
    font-weight: 500;
    color: var(--text-primary);
    background: var(--card-warm);
    border: 1.5px solid var(--border-strong);
    border-radius: 12px;
    padding: 10px 12px;
    width: 148px;
    transition: border-color 0.25s ease, box-shadow 0.25s var(--ease-glide);
  }
  .date-pair input[type="date"]:hover { border-color: var(--tan); }
  .date-pair input[type="date"]:focus {
    outline: none;
    border-color: var(--mango-bright);
    box-shadow: 0 0 0 4px rgba(242, 153, 74, 0.16);
  }

  .filter-risk { flex: 1 1 190px; min-width: 180px; max-width: 280px; }
  .risk-slider-row { display: flex; align-items: center; gap: 12px; }
  .risk-readout {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
    min-width: 52px;
    text-align: right;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    flex: 1;
    height: 8px;
    border-radius: 6px;
    background: linear-gradient(90deg, var(--mango-bright) 0 var(--fill, 0%), var(--tan-soft) var(--fill, 0%));
    border: 1px solid var(--border);
    cursor: pointer;
    transition: box-shadow 0.25s ease;
  }
  input[type="range"]:hover { box-shadow: 0 0 0 4px rgba(242, 153, 74, 0.10); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: linear-gradient(145deg, #fff, #fdf3e6);
    border: 2px solid var(--mango);
    box-shadow: 0 2px 6px rgba(210, 114, 10, 0.35);
    cursor: grab;
    transition: transform 0.25s var(--ease-spring), box-shadow 0.25s ease;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.18); box-shadow: 0 3px 10px rgba(210, 114, 10, 0.45); }
  input[type="range"]:active::-webkit-slider-thumb { cursor: grabbing; transform: scale(1.05); }
  input[type="range"]::-moz-range-thumb {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--mango);
    box-shadow: 0 2px 6px rgba(210, 114, 10, 0.35);
    cursor: grab;
  }

  .reset-btn {
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 13px;
    padding: 11px 18px;
    border-radius: 12px;
    cursor: pointer;
    background: transparent;
    border: 1.5px solid var(--border-strong);
    color: var(--text-secondary);
    transition: all 0.25s var(--ease-spring);
    white-space: nowrap;
  }
  .reset-btn:hover { color: var(--salmon); border-color: var(--salmon-bright); background: var(--social-bg); transform: translateY(-1px); }
  .reset-btn:active { transform: scale(0.94); }

  /* ═══════════════════ WORKLIST BOARD ═══════════════════ */
  .board {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
  }
  /* No overflow clipping on .board — it would break the sticky header. The
     table always fits its container (fixed layout + wrapping), so the rounded
     corners are applied to the corner cells instead. */
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    font-size: 14px;
  }
  /* Fixed-layout column proportions — sum to 100%, tuned per breakpoint so
     every column stays visible with zero horizontal scroll in EN and ES. */
  col.c-patient { width: 19%; }
  col.c-priority { width: 8%; }
  col.c-window { width: 13.5%; }
  col.c-risk { width: 8.5%; }
  col.c-driver { width: 25%; }
  col.c-action { width: 14%; }
  col.c-script { width: 12%; }
  th, td {
    text-align: left;
    padding: 16px 14px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    overflow-wrap: anywhere;
  }
  th:first-child, td:first-child { padding-left: 26px; }
  th:last-child, td:last-child { padding-right: 26px; }
  thead th {
    position: sticky;
    top: var(--nav-h);
    z-index: 5;
    background: linear-gradient(180deg, var(--card-warm), #fdf9f1);
    font-family: var(--font-ui);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    font-weight: 700;
    line-height: 1.45;
    user-select: none;
    vertical-align: bottom;
    border-bottom: 1px solid var(--border-strong);
  }
  thead th:first-child { border-top-left-radius: var(--radius-lg); }
  thead th:last-child { border-top-right-radius: var(--radius-lg); }
  tbody tr:last-child td:first-child { border-bottom-left-radius: var(--radius-lg); }
  tbody tr:last-child td:last-child { border-bottom-right-radius: var(--radius-lg); }
  th.sortable { cursor: pointer; transition: color 0.2s ease, background 0.2s ease, box-shadow 0.2s ease; }
  th.sortable:hover { color: var(--text-primary); background: var(--tan-soft); }
  th.sortable:active .sort-arrow { transform: translateY(2px) scale(0.9); }
  th.sorted { color: var(--text-primary); box-shadow: inset 0 -2px 0 var(--mango-bright); }
  .sort-arrow {
    display: inline-block;
    margin-left: 5px;
    font-size: 11px;
    color: var(--mango);
    transition: transform 0.3s var(--ease-spring);
  }
  th.sorted .sort-arrow { animation: bump 0.4s var(--ease-spring); }
  .sort-arrow.idle { color: var(--border-strong); }
  tr:last-child td { border-bottom: none; }

  /* Row entrance — full stagger on discrete renders (load, sort, language,
     chip/date filters); a fast unstaggered fade while typing or dragging the
     risk slider so continuous input never blanks the list. */
  @keyframes rowIn {
    from { opacity: 0; transform: translateY(9px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  tbody tr.patient-row { animation: rowIn 0.45s var(--ease-out) both; }
  tbody.soft tr.patient-row { animation-duration: 0.2s; animation-delay: 0ms !important; }

  .patient-name { font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
  .lang-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.06em;

    border: 1px solid var(--border);

    margin-left: 7px;
    vertical-align: 1px;

  /* Meters — thin, rounded, gradient fills */
  .risk-bar-wrap, .priority-bar-wrap {

  }
  .priority-bar-fill {
    height: 100%;
    border-radius: 4px;

    animation: fillIn 0.8s 0.15s var(--ease-out) both;
  }
  @keyframes fillIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  tbody.soft .risk-bar-fill, tbody.soft .priority-bar-fill { animation: none; }
  .risk-value, .priority-index { font-weight: 700; font-variant-numeric: tabular-nums; }
  .driver-label { font-size: 13.5px; color: var(--text-secondary); line-height: 1.5; }

  /* Action pills — color-coded routing */
  .action-pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.01em;
    padding: 5px 13px;

  }
  tr.patient-row:hover .action-pill { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .action-pill::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: none;
  }
  .action-pharmacist { background: var(--pharmacist-bg); color: var(--pharmacist-text); border-color: rgba(15, 163, 145, 0.28); }
  .action-pharmacist::before { background: var(--pharmacist); }
  .action-social_worker { background: var(--social-bg); color: var(--social-text); border-color: rgba(228, 88, 95, 0.28); }
  .action-social_worker::before { background: var(--social); }
  .action-chw_call { background: var(--chw-bg); color: var(--chw-text); border-color: rgba(210, 114, 10, 0.28); }
  .action-chw_call::before { background: var(--chw); }

  .badges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
  .badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .badge-safety { background: #fbe0e0; color: #9b1c1c; border: 1px solid #f3c3c3; }
  .badge-review { background: #fdf0d3; color: #8a5340; border: 1px solid #f0dcae; }
  tr.safety-row td { background: #fdf3f1; }
  tr.safety-row td:first-child { box-shadow: inset 3px 0 0 var(--salmon); }
  tr.safety-row:hover td { background: #fcebe7; }
  tr.safety-row:hover td:first-child { box-shadow: inset 3px 0 0 var(--salmon); }
  tr.safety-row.open td { background: #fdf0ed; }

  /* Expand button — tactile */
  .expand-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-family: var(--font-ui);
    font-weight: 700;
    font-size: 12.5px;
    padding: 7px 13px;
    border-radius: 10px;
    cursor: pointer;
    background: var(--card);
    border: 1px solid var(--border-strong);
    color: var(--text-secondary);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, var(--shadow-sm);
    transition: all 0.22s var(--ease-spring);
    white-space: nowrap;
  }
  .expand-btn .chev { transition: transform 0.35s var(--ease-spring); flex: none; }
  .expand-btn:hover {
    color: var(--text-primary);
    border-color: var(--tan);
    transform: translateY(-1px);
    box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset, var(--shadow-md);
  }
  .expand-btn:hover .chev { transform: translateY(2px); }
  .expand-btn:active { transform: translateY(1px) scale(0.95); box-shadow: inset 0 2px 4px rgba(60, 42, 18, 0.12); }
  .expand-btn.open {
    background: var(--text-primary);
    border-color: var(--text-primary);
    color: #fff;
    box-shadow: 0 2px 6px rgba(35, 29, 21, 0.3);
  }
  .expand-btn.open .chev { transform: rotate(180deg); }

  /* Script drawer — animates open AND closed via grid-template-rows */
  .script-row td { padding: 0 26px; border-bottom: none; background: var(--card-warm); transition: border-color 0.3s ease; }
  .script-row.open td { border-bottom: 1px solid var(--border); }
  .script-row:last-child td { border-bottom: none; }
  .drawer {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows 0.5s var(--ease-glide);
  }
  .script-row.open .drawer { grid-template-rows: 1fr; }
  .drawer-inner {
    overflow: hidden;
    min-height: 0;
    opacity: 0;
    transform: translateY(-6px);
    transition: opacity 0.3s ease, transform 0.4s var(--ease-out);
  }
  .script-row.open .drawer-inner { opacity: 1; transform: translateY(0); transition-delay: 0.08s; }
  .script-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    box-shadow: var(--shadow-sm);
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--text-secondary);
    margin: 6px 0 22px;
  }
  .script-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--mango);
    margin-bottom: 8px;
    font-weight: 800;
  }
  .sms-nudge {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 16px;
    padding: 12px 15px;
    background: var(--sms-bg);
    border: 1px dashed rgba(15, 163, 145, 0.4);
    border-radius: 11px;
    font-size: 13px;
    color: var(--text-primary);
  }
  .sms-nudge .sms-icon { font-size: 16px; line-height: 1.3; }
  .sms-nudge strong { color: var(--pharmacist-text); }

  /* Status / loading / empty */
  .status-line { font-size: 14px; color: var(--text-muted); padding: 3.4rem 0; text-align: center; font-weight: 500; }
  @keyframes pulseDot { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  .loading-dots span {
    display: inline-block;
    width: 7px; height: 7px;
    margin: 0 3px;
    border-radius: 50%;
    background: var(--mango-bright);
    animation: pulseDot 1.1s ease-in-out infinite;
  }
  .loading-dots span:nth-child(2) { background: var(--salmon); animation-delay: 0.18s; }
  .loading-dots span:nth-child(3) { background: var(--aqua-bright); animation-delay: 0.36s; }
  .empty-state {
    text-align: center;
    padding: 4rem 1.5rem;
    animation: rise 0.5s var(--ease-out) both;
  }
  .empty-state .empty-glyph { font-size: 34px; margin-bottom: 0.8rem; }
  .empty-state h3 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    margin: 0 0 0.4rem;
    color: var(--text-primary);
  }
  .empty-state p { margin: 0 0 1.4rem; color: var(--text-secondary); font-size: 14px; }

  @media (max-width: 900px) {
    .wrap, .topnav-inner { padding-left: 1.1rem; padding-right: 1.1rem; }
    th, td { padding: 13px 8px; }
    th:first-child, td:first-child { padding-left: 14px; }
    th:last-child, td:last-child { padding-right: 14px; }
    table { font-size: 12.5px; }
    .patient-name { font-size: 13.5px; }
    .driver-label { font-size: 12px; }
    .action-pill { font-size: 11px; padding: 4px 8px; }
    .expand-btn { font-size: 11px; padding: 6px 8px; }

    col.c-patient { width: 17.5%; }
    col.c-priority { width: 7.5%; }

  @media (max-width: 640px) {
    .topnav-inner { padding-top: 10px; padding-bottom: 10px; }
    .brand-tag { display: none; }
    .hero { padding-top: 2.4rem; }
    .toolbar { padding: 16px 16px 18px; }
    .controls-row { gap: 12px; }
    .date-pair input[type="date"] { width: 128px; }
    .action-pill { font-size: 10.5px; padding: 3px 7px; gap: 5px; }

  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }

  }
</style>

<script>
const API_BASE = "http://localhost:8000";

const STRINGS = {
  en: {
    title: "CHW worklist",
    subtitle: "Patients at risk of a medication persistence break, ranked by urgency",
    cohort: "Cohort",
    capacity: "Capacity",
    showing: "Showing",
    patients: "patients",
    colPatient: "Patient",
    colPriority: "Priority",
    colBreakWindow: "Predicted break window",
    colRisk: "Risk",
    colDriver: "Top driver",
    colAction: "Routed to",
    colScript: "Script",
    badgeSafety: "Safety override",
    badgeReview: "Human review",
    viewScript: "View script",
    hideScript: "Hide",
    outreachScript: "Outreach script",
    pharmacist: "Pharmacist",
    socialWorker: "Social worker",
    chwCall: "CHW call",
    loading: "Loading worklist…",
    error: "Couldn't reach the API. Is uvicorn running on port 8000?",
    legendPharmacist: "Pharmacist",
    legendSocial: "Social worker",
    legendChw: "CHW call",
    smsLabel: "SMS nudge scheduled",
    smsLangEn: "English",
    smsLangEs: "Spanish",
    smsDetail: (lang, date) => `sending in ${lang} on ${date}`,
    legendTitle: "Care routing",
    legendHint: "click to filter",
    searchLabel: "Search",
    searchPlaceholder: "Search patients…",
    filterWindow: "Break window",
    filterFrom: "From",
    filterTo: "To",
    filterMinRisk: "Min risk",
    clearFilters: "Reset",
    matches: (n, total) => `${n} of ${total} match`,
    emptyTitle: "No patients match",
    emptyBody: "Try adjusting your search or filters."
  },
  es: {
    title: "Lista de trabajo CHW",
    subtitle: "Pacientes en riesgo de interrumpir su medicamento, ordenados por urgencia",
    cohort: "Cohorte",
    capacity: "Capacidad",
    showing: "Mostrando",
    patients: "pacientes",
    colPatient: "Paciente",
    colPriority: "Prioridad",
    colBreakWindow: "Ventana prevista de interrupción",
    colRisk: "Riesgo",
    colDriver: "Factor principal",
    colAction: "Enviado a",
    colScript: "Guion",
    badgeSafety: "Anulación de seguridad",
    badgeReview: "Revisión humana",
    viewScript: "Ver guion",
    hideScript: "Ocultar",
    outreachScript: "Guion de contacto",
    pharmacist: "Farmacéutico",
    socialWorker: "Trabajador social",
    chwCall: "Llamada de CHW",
    loading: "Cargando lista…",
    error: "No se pudo conectar con la API. ¿Está uvicorn corriendo en el puerto 8000?",
    legendPharmacist: "Farmacéutico",
    legendSocial: "Trabajador social",
    legendChw: "Llamada de CHW",
    smsLabel: "Recordatorio SMS programado",
    smsLangEn: "inglés",
    smsLangEs: "español",
    smsDetail: (lang, date) => `se enviará en ${lang} el ${date}`,
    legendTitle: "Enrutamiento",
    legendHint: "haz clic para filtrar",
    searchLabel: "Buscar",
    searchPlaceholder: "Buscar paciente…",
    filterWindow: "Ventana de interrupción",
    filterFrom: "Desde",
    filterTo: "Hasta",
    filterMinRisk: "Riesgo mín.",
    clearFilters: "Restablecer",
    matches: (n, total) => `${n} de ${total} coinciden`,
    emptyTitle: "Ningún paciente coincide",
    emptyBody: "Prueba a ajustar la búsqueda o los filtros."
  }
};

const ALL_ACTIONS = ["pharmacist", "social_worker", "chw_call"];

let currentLang = "en";
let worklistData = null;
let sortKey = "break_window_start";
let sortAsc = true;
let expandedId = null;

const filters = {
  query: "",
  dateFrom: "",   // ISO yyyy-mm-dd, matches break window by overlap
  dateTo: "",
  minRisk: 0,     // 0–100
  actions: new Set(ALL_ACTIONS)
};

/* ── Hero animation: plays on initial load and language toggle only ── */
function playHero() {
  const hero = document.getElementById("hero");
  hero.classList.remove("hero-in");
  void hero.offsetWidth; // force reflow so the animation retriggers
  hero.classList.add("hero-in");
}

/* ── Scroll-reactive background: expose scroll progress as --sp ── */
let scrollTicking = false;
function updateScrollProgress() {
  const max = document.documentElement.scrollHeight - window.innerHeight;
  const p = max > 0 ? window.scrollY / max : 0;
  document.documentElement.style.setProperty("--sp", p.toFixed(4));
  scrollTicking = false;
}
window.addEventListener("scroll", () => {
  if (!scrollTicking) {
    scrollTicking = true;
    requestAnimationFrame(updateScrollProgress);
  }
}, { passive: true });

function setLang(lang) {
  currentLang = lang;
  document.getElementById("btn-en").classList.toggle("active", lang === "en");
  document.getElementById("btn-es").classList.toggle("active", lang === "es");
  render();
  playHero();
}

function actionLabel(action) {
  const s = STRINGS[currentLang];
  if (action === "pharmacist") return s.pharmacist;
  if (action === "social_worker") return s.socialWorker;
  if (action === "chw_call") return s.chwCall;
  return action;
}

function formatDateRange(start, end) {
  const opts = { month: "short", day: "numeric" };
  const locale = currentLang === "es" ? "es-ES" : "en-US";
  const startDate = new Date(start + "T00:00:00");
  const endDate = new Date(end + "T00:00:00");
  return `${startDate.toLocaleDateString(locale, opts)} – ${endDate.toLocaleDateString(locale, opts)}`;
}

function formatSingleDate(dateStr) {
  const opts = { month: "short", day: "numeric" };
  const locale = currentLang === "es" ? "es-ES" : "en-US";
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString(locale, opts);
}

function buildSmsLine(p) {
  const s = STRINGS[currentLang];
  // Nudge fires at the start of the predicted break window, in the
  // patient's preferred language.
  const langName = p.preferred_language === "es" ? s.smsLangEs : s.smsLangEn;
  const date = formatSingleDate(p.break_window_start);
  return s.smsDetail(langName, date);
}

function sortBy(key) {
  if (sortKey === key) {
    sortAsc = !sortAsc;
  } else {
    sortKey = key;
    sortAsc = true;
  }
  render();
}

/* ── Row expand: toggled in place (no re-render) so the drawer can
      animate both open and closed ── */
function toggleScript(patientId) {
  const willOpen = expandedId !== patientId;
  if (expandedId !== null) setRowOpen(expandedId, false);
  expandedId = willOpen ? patientId : null;
  if (willOpen) setRowOpen(patientId, true);
}

function setRowOpen(patientId, open) {
  const sel = window.CSS && CSS.escape ? CSS.escape(String(patientId)) : patientId;
  const row = document.querySelector(`tr.patient-row[data-id="${sel}"]`);
  const drawer = document.querySelector(`tr.script-row[data-id="${sel}"]`);
  if (!row || !drawer) return;
  const s = STRINGS[currentLang];
  row.classList.toggle("open", open);
  drawer.classList.toggle("open", open);
  const btn = row.querySelector(".expand-btn");
  btn.classList.toggle("open", open);
  btn.querySelector(".eb-label").textContent = open ? s.hideScript : s.viewScript;
}

/* ── Filters: all conditions AND together, applied to the fetched list ── */
function applyFilters(list) {
  const q = filters.query.trim().toLowerCase();
  return list.filter(p => {
    if (q && !p.display_name.toLowerCase().includes(q)) return false;
    if (!filters.actions.has(p.routed_action)) return false;
    if (p.risk_score * 100 < filters.minRisk) return false;
    // Date range matches when it overlaps the predicted break window.
    // ISO date strings compare correctly as plain strings.
    if (filters.dateFrom && p.break_window_end < filters.dateFrom) return false;
    if (filters.dateTo && p.break_window_start > filters.dateTo) return false;
    return true;
  });
}

function toggleAction(btn) {
  const action = btn.dataset.action;
  if (filters.actions.has(action)) {
    filters.actions.delete(action);
    btn.classList.remove("active");
  } else {
    filters.actions.add(action);
    btn.classList.add("active");
  }
  render();
}

function resetFilters() {
  filters.query = "";
  filters.dateFrom = "";
  filters.dateTo = "";
  filters.minRisk = 0;
  filters.actions = new Set(ALL_ACTIONS);
  document.getElementById("search-input").value = "";
  document.getElementById("date-from").value = "";
  document.getElementById("date-to").value = "";
  const slider = document.getElementById("risk-slider");
  slider.value = 0;
  slider.style.setProperty("--fill", "0%");
  document.querySelectorAll(".legend-chip").forEach(c => c.classList.add("active"));
  render();
}

/* Coalesce rapid input events (typing, slider drags) into at most one
   re-render per animation frame — keeps the 900+ row list feeling instant. */
let renderQueued = false;
function scheduleRender() {
  if (renderQueued) return;
  renderQueued = true;
  const run = () => {
    if (!renderQueued) return;
    renderQueued = false;
    render("soft");
  };
  requestAnimationFrame(run);
  setTimeout(run, 40); // rAF can starve in hidden tabs — never drop a render
}

function initToolbar() {
  document.getElementById("search-input").addEventListener("input", e => {
    filters.query = e.target.value;
    scheduleRender();
  });
  document.getElementById("date-from").addEventListener("change", e => {
    filters.dateFrom = e.target.value;
    render();
  });
  document.getElementById("date-to").addEventListener("change", e => {
    filters.dateTo = e.target.value;
    render();
  });
  const slider = document.getElementById("risk-slider");
  slider.addEventListener("input", e => {
    filters.minRisk = Number(e.target.value);
    slider.style.setProperty("--fill", `${filters.minRisk}%`);
    scheduleRender();
  });
}

async function loadWorklist() {
  try {
    const res = await fetch(`${API_BASE}/worklist`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    worklistData = await res.json();
    document.getElementById("toolbar").classList.add("ready");
    render();
    playHero();
  } catch (err) {
    const s = STRINGS[currentLang];
    document.getElementById("content").innerHTML =
      `<p class="status-line">${s.error}<br><span style="font-size:11px">${err.message}</span></p>`;
  }
}

function sortIndicator(key) {
  if (sortKey === key) return `<span class="sort-arrow">${sortAsc ? "↑" : "↓"}</span>`;
  return `<span class="sort-arrow idle">↕</span>`;
}

function syncToolbarLabels(s) {
  document.getElementById("legend-title").textContent = s.legendTitle;
  document.getElementById("legend-hint").textContent = s.legendHint;
  document.getElementById("lbl-search").textContent = s.searchLabel;
  document.getElementById("search-input").placeholder = s.searchPlaceholder;
  document.getElementById("lbl-window").textContent = s.filterWindow;
  document.getElementById("date-from").setAttribute("aria-label", s.filterFrom);
  document.getElementById("date-to").setAttribute("aria-label", s.filterTo);
  document.getElementById("lbl-risk").textContent = s.filterMinRisk;
  document.getElementById("risk-readout").textContent = `≥ ${filters.minRisk}%`;
  document.getElementById("clear-filters").textContent = s.clearFilters;
}

function bumpMatchCount() {
  const el = document.getElementById("match-count");
  el.classList.remove("bump");
  void el.offsetWidth;
  el.classList.add("bump");
}

function render(mode = "full") {
  const s = STRINGS[currentLang];
  document.getElementById("title").textContent = s.title;
  document.getElementById("subtitle").textContent = s.subtitle;
  document.getElementById("legend-pharmacist").textContent = s.legendPharmacist;
  document.getElementById("legend-social").textContent = s.legendSocial;
  document.getElementById("legend-chw").textContent = s.legendChw;
  syncToolbarLabels(s);

  if (!worklistData) return;

  const filtered = applyFilters(worklistData.worklist);

  document.getElementById("match-count").textContent = s.matches(filtered.length, worklistData.worklist.length);
  bumpMatchCount();

  document.getElementById("meta-bar").innerHTML = `
    <div class="stat-chip"><span class="stat-label">${s.cohort}</span><span class="stat-value">${worklistData.cohort_size}</span></div>
    <div class="stat-chip"><span class="stat-label">${s.capacity}</span><span class="stat-value">${worklistData.capacity}</span></div>
    <div class="stat-chip"><span class="stat-label">${s.showing}</span><span class="stat-value">${filtered.length}</span><span class="stat-suffix">${s.patients}</span></div>
  `;

  if (filtered.length === 0) {
    document.getElementById("content").innerHTML = `
      <div class="board">
        <div class="empty-state">
          <div class="empty-glyph">🔍</div>
          <h3>${s.emptyTitle}</h3>
          <p>${s.emptyBody}</p>
          <button class="reset-btn" onclick="resetFilters()">${s.clearFilters}</button>
        </div>
      </div>
    `;
    return;
  }

  const sorted = [...filtered].sort((a, b) => {
    let av = a[sortKey], bv = b[sortKey];
    if (typeof av === "string") av = av.toLowerCase();
    if (typeof bv === "string") bv = bv.toLowerCase();
    if (av < bv) return sortAsc ? -1 : 1;
    if (av > bv) return sortAsc ? 1 : -1;
    return 0;
  });

  // Normalize priority_score to a 0-100 index relative to the top-priority
  // patient in the current view (raw scores are urgency*modifiability and
  // very small in absolute terms, so a relative index reads far better).
  const maxPriority = Math.max(...sorted.map(p => p.priority_score || 0), 0);

  const rows = sorted.map((p, i) => {
    const driverLabel = currentLang === "es" ? p.driver_label_es : p.driver_label_en;
    const script = currentLang === "es" ? p.outreach_script_es : p.outreach_script_en;
    const isExpanded = expandedId === p.patient_id;
    const langBadge = p.preferred_language === "es" ? "ES" : "EN";
    const stagger = Math.min(i * 22, 380);

    const priorityIndex = maxPriority > 0 ? Math.round((p.priority_score / maxPriority) * 100) : 0;
    const badges = [];
    if (p.is_safety_override) badges.push(`<span class="badge badge-safety">${s.badgeSafety}</span>`);
    // requires_human_review co-occurs with a safety override; only show it on
    // its own when it's flagged without the override badge already covering it.
    if (p.requires_human_review && !p.is_safety_override) badges.push(`<span class="badge badge-review">${s.badgeReview}</span>`);
    const badgesHtml = badges.length ? `<div class="badges">${badges.join("")}</div>` : "";

    return `
      <tr class="patient-row ${p.is_safety_override ? "safety-row" : ""} ${isExpanded ? "open" : ""}"
          data-id="${p.patient_id}" style="animation-delay:${stagger}ms"
          tabindex="0" onclick="toggleScript('${p.patient_id}')"
          onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleScript('${p.patient_id}')}">
        <td>
          <span class="patient-name">${p.display_name}</span>
          <span class="lang-badge">${langBadge}</span>
          ${badgesHtml}
        </td>
        <td class="priority-cell">
          <span class="priority-index">${priorityIndex}</span>
          <div class="priority-bar-wrap"><div class="priority-bar-fill" style="width:${priorityIndex}%"></div></div>
        </td>
        <td class="break-window">${formatDateRange(p.break_window_start, p.break_window_end)}</td>
        <td>
          <span class="risk-value">${Math.round(p.risk_score * 100)}%</span>
          <div class="risk-bar-wrap"><div class="risk-bar-fill" style="width:${Math.round(p.risk_score * 100)}%"></div></div>
        </td>
        <td class="driver-label">${driverLabel}</td>
        <td><span class="action-pill action-${p.routed_action}">${actionLabel(p.routed_action)}</span></td>
        <td>
          <button class="expand-btn ${isExpanded ? "open" : ""}" onclick="event.stopPropagation();toggleScript('${p.patient_id}')">
            <span class="eb-label">${isExpanded ? s.hideScript : s.viewScript}</span>
            <svg class="chev" width="10" height="10" viewBox="0 0 10 10" fill="none" aria-hidden="true"><path d="M2 3.5 L5 6.5 L8 3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </td>
      </tr>
      <tr class="script-row ${isExpanded ? "open" : ""}" data-id="${p.patient_id}">
        <td colspan="7">
          <div class="drawer"><div class="drawer-inner">
            <div class="script-panel">
              <div class="script-label">${s.outreachScript}</div>
              ${script}
              <div class="sms-nudge">
                <span class="sms-icon">📱</span><span><strong>${s.smsLabel}</strong> — ${buildSmsLine(p)}</span>
              </div>
            </div>
          </div></div>
        </td>
      </tr>
    `;
  }).join("");

  document.getElementById("content").innerHTML = `
    <div class="board">
      <table>
        <colgroup>
          <col class="c-patient">
          <col class="c-priority">
          <col class="c-window">
          <col class="c-risk">
          <col class="c-driver">
          <col class="c-action">
          <col class="c-script">
        </colgroup>
        <thead>
          <tr>
            <th class="sortable ${sortKey === "display_name" ? "sorted" : ""}" onclick="sortBy('display_name')">${s.colPatient}${sortIndicator("display_name")}</th>
            <th class="sortable ${sortKey === "priority_score" ? "sorted" : ""}" onclick="sortBy('priority_score')">${s.colPriority}${sortIndicator("priority_score")}</th>
            <th class="sortable ${sortKey === "break_window_start" ? "sorted" : ""}" onclick="sortBy('break_window_start')">${s.colBreakWindow}${sortIndicator("break_window_start")}</th>
            <th class="sortable ${sortKey === "risk_score" ? "sorted" : ""}" onclick="sortBy('risk_score')">${s.colRisk}${sortIndicator("risk_score")}</th>
            <th>${s.colDriver}</th>
            <th>${s.colAction}</th>
            <th>${s.colScript}</th>
          </tr>
        </thead>
        <tbody class="${mode === "soft" ? "soft" : ""}">${rows}</tbody>
      </table>
    </div>
  `;
}

initToolbar();
playHero();
loadWorklist();
</script>
</body>
</html>
